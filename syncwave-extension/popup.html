<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SyncWave</title>
  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #141414;
      --accent: #7c3aed;
      --accent-glow: rgba(124, 58, 237, 0.4);
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --success: #10b981;
      --error: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
    }

    body {
      width: 320px;
      margin: 0;
      padding: 20px;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .logo svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .app-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 20px;
      padding: 8px 12px;
      background: var(--bg-secondary);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .status-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--error);
    }

    .status-indicator.online {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    input {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: white;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background: #8b5cf6;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.05);
      box-shadow: none;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.1);
      color: var(--error);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .btn-danger:hover {
      background: var(--error);
      color: white;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .room-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .room-code {
      font-size: 24px;
      font-weight: 700;
      font-family: monospace;
      letter-spacing: 2px;
      color: var(--accent);
    }

    .members-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .member-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .member-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--success);
    }

    .hidden {
      display: none;
    }

    .footer {
      text-align: center;
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
    </div>
    <div class="app-name">SyncWave</div>
  </div>

  <div class="status-bar">
    <div id="status-dot" class="status-indicator"></div>
    <span id="status-text">Connecting to Firebase...</span>
  </div>

  <!-- Username Section -->
  <div id="username-section" class="card">
    <div class="section-title">Your Identity</div>
    <div class="input-group">
      <input type="text" id="username-input" placeholder="Enter username...">
      <button id="save-username-btn" class="btn">Save Username</button>
    </div>
  </div>

  <!-- Join/Create Section -->
  <div id="join-section" class="card hidden">
    <div class="section-title">Join or Create Room</div>
    <div class="input-group">
      <input type="text" id="room-input" placeholder="Enter 6-digit code..." maxlength="6">
      <button id="join-btn" class="btn">Join Room</button>
      <div style="text-align: center; margin: 4px 0; font-size: 11px; color: var(--text-secondary);">OR</div>
      <button id="create-btn" class="btn btn-secondary">Create New Room</button>
    </div>
  </div>

  <!-- Room Info Section -->
  <div id="room-info-section" class="card hidden">
    <div class="section-title">Active Room</div>
    <div class="room-display">
      <div id="active-room-code" class="room-code">------</div>
      <button id="copy-btn" class="btn btn-secondary" style="padding: 6px 10px; font-size: 12px;">Copy</button>
    </div>
    <div class="section-title">Members</div>
    <div id="members-list" class="members-list">
      <!-- Members will be injected here -->
    </div>
    <button id="leave-btn" class="btn btn-danger" style="width: 100%;">Leave Room</button>
  </div>

  <div class="footer">
    SyncWave v1.0 • Real-time YouTube Sync
  </div>

  <script src="firebase-config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
